<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Static Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: #398ff0;
      font-family: Inter, sans-serif;
    }

    #stage {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1920px;
      height: 1104px;
      margin: -552px 0 0 -960px;
      overflow: hidden;
      background: #398ff0;
    }

    .panel {
      position: absolute;
      background: #fff;
      border-radius: 56px;
    }

    .search {
      left: 94px;
      top: 106px;
      width: 1014px;
      height: 174px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 54px;
      border-radius: 90px;
      color: #a7a7a7;
      font-size: 52px;
      font-weight: 400;
    }

    .search-icon {
      width: 66px;
      height: 66px;
      color: #151515;
    }

    .button {
      position: absolute;
      top: 346px;
      height: 162px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      color: #333;
      font-size: 48px;
      font-weight: 700;
    }

    .button-one { left: 96px; width: 310px; }
    .button-two { left: 464px; width: 420px; }
    .button-heart { left: 916px; width: 164px; }

    .heart {
      width: 72px;
      height: 72px;
      color: #ff8258;
    }

    .rank-card {
      left: 1168px;
      top: 106px;
      width: 464px;
      height: 388px;
      padding: 62px 52px;
    }

    .card-label {
      color: #282828;
      font-size: 44px;
      font-weight: 700;
    }

    .rank-content {
      display: flex;
      align-items: center;
      gap: 34px;
      margin-top: 48px;
    }

    .star {
      width: 104px;
      height: 104px;
      color: #f3c719;
    }

    .rank-value {
      color: #393939;
      font-size: 96px;
      font-weight: 600;
      letter-spacing: -5px;
    }

    .schedule-card {
      left: 96px;
      top: 550px;
      width: 1014px;
      height: 450px;
      padding: 64px 52px;
    }

    .schedule-strip {
      height: 192px;
      margin-top: 40px;
      display: flex;
      align-items: stretch;
      overflow: hidden;
      border-radius: 52px;
      background: #ff8258;
    }

    .day {
      flex: 1;
      padding-top: 24px;
      text-align: center;
      color: #fff;
      font-size: 40px;
    }

    .day-number {
      display: block;
      margin-bottom: 14px;
      font-weight: 500;
    }

    .day-name {
      display: block;
      color: #ffd4c5;
      font-size: 32px;
      font-weight: 400;
    }

    .day.selected {
      align-self: center;
      flex: 0 0 116px;
      height: 156px;
      padding-top: 18px;
      border-radius: 32px;
      background: #fff;
      color: #292929;
    }

    .day.selected .day-name { color: #777; }

    .metric-card {
      left: 1168px;
      top: 550px;
      width: 464px;
      height: 450px;
      padding: 62px 52px;
    }

    .metric-value {
      margin-top: 48px;
      color: #393939;
      font-size: 94px;
      font-weight: 500;
      letter-spacing: 2px;
      white-space: nowrap;
    }

    .metric-change {
      display: inline-block;
      margin-top: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      background: #c9f5d5;
      color: #39a85a;
      font-size: 36px;
      font-weight: 600;
    }

    .tool {
      position: absolute;
      right: 52px;
      width: 164px;
      height: 164px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #fff;
      color: #ff8258;
    }

    .tool-home { top: 108px; }
    .tool-user { top: 354px; }
    .tool-settings { top: 600px; }
    .tool-trash { top: 846px; }

    .tool svg { width: 82px; height: 82px; }
  </style>
</head>
<body>
  <div id="stage">
    <div class="panel search" data-name="Search Bar">
      <span>Search</span>
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="10.8" cy="10.8" r="7.1" stroke="currentColor" stroke-width="2"/>
        <path d="m16 16 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="panel button button-one" data-name="Button One">Button</div>
    <div class="panel button button-two" data-name="Button With Heart">
      <svg class="heart" data-name="Heart Icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
      <span>Button</span>
    </div>
    <div class="panel button button-heart" data-name="Heart Button">
      <svg class="heart" data-name="Heart Icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
    </div>

    <div class="panel rank-card" data-name="Ranks Card">
      <h2 class="card-label" data-name="Ranks Label">Ranks</h2>
      <div class="rank-content">
        <svg class="star" data-name="Rank Star" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
        </svg>
        <span class="rank-value" data-name="Rank Value">4,8</span>
      </div>
    </div>

    <div class="panel schedule-card" data-name="Schedule Card">
      <h2 class="card-label" data-name="Schedule Label">Schedule</h2>
      <div class="schedule-strip" data-name="Weekly Schedule">
        <div class="day"><span class="day-number">6</span><span class="day-name">Mon</span></div>
        <div class="day"><span class="day-number">7</span><span class="day-name">Tue</span></div>
        <div class="day"><span class="day-number">8</span><span class="day-name">Wed</span></div>
        <div class="day selected" data-name="Selected Thursday">
          <span class="day-number">9</span><span class="day-name">Thu</span>
        </div>
        <div class="day"><span class="day-number">10</span><span class="day-name">Fri</span></div>
        <div class="day"><span class="day-number">11</span><span class="day-name">Sat</span></div>
        <div class="day"><span class="day-number">12</span><span class="day-name">Sun</span></div>
      </div>
    </div>

    <div class="panel metric-card" data-name="Metric Card">
      <h2 class="card-label" data-name="Metric Label">Card</h2>
      <p class="metric-value" data-name="Metric Value">180 K</p>
      <p class="metric-change" data-name="Metric Change">+36%</p>
    </div>

    <div class="tool tool-home" data-name="Home Icon">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M3 10.8 12 3l9 7.8v9a1.2 1.2 0 0 1-1.2 1.2h-5.1v-6.4H9.3V21H4.2A1.2 1.2 0 0 1 3 19.8v-9Z"/>
      </svg>
    </div>

    <div class="tool tool-user" data-name="User Icon">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 21c.3-4.1 3.5-6.5 8-6.5s7.7 2.4 8 6.5H4Z"/>
      </svg>
    </div>

    <div class="tool tool-settings" data-name="Settings Icon">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 3.2 14 4l1.9-.6 1.8 1.8-.6 1.9.8 2 1.8 1v2.5l-1.8 1-.8 2 .6 1.9-1.8 1.8-1.9-.6-2 .8-1 1.8H8.5l-1-1.8-2-.8-1.9.6-1.8-1.8.6-1.9-.8-2-1.8-1v-2.5l1.8-1 .8-2-.6-1.9 1.8-1.8 1.9.6 2-.8 1-1.8H12Z" transform="translate(2 1)" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8"/>
      </svg>
    </div>

    <div class="tool tool-trash" data-name="Trash Icon">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4.5 7h15M9 7V4.5h6V7m3 0-.8 13H6.8L6 7m3.5 3v6m5-6v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <script>
    function fitToWindow() {
      const scale = Math.min(innerWidth / 1920, innerHeight / 1104);
      document.getElementById("stage").style.transform = `scale(${scale})`;
    }

    window.addEventListener("resize", fitToWindow);
    fitToWindow();
  </script>
</body>
</html>
