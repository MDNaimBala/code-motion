<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spatial Audio HUD · Code Motion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  background: #04050a;
  overflow: hidden;
  font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* 1080 x 1080 Stage Viewport */
#stage {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 1080px;
  height: 1080px;
  margin: -540px 0 0 -540px;
  overflow: hidden;
  background: #050711;
  transform-origin: 50% 50%;
}

/* Deep Ambient Atmosphere Glow Orbs */
.glow-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(100px);
  pointer-events: none;
  opacity: 0.42;
}
#orb1 {
  left: 140px;
  top: 160px;
  width: 440px;
  height: 440px;
  background: radial-gradient(circle, #7c3aed 0%, transparent 70%);
}
#orb2 {
  left: 540px;
  top: 500px;
  width: 480px;
  height: 480px;
  background: radial-gradient(circle, #06b6d4 0%, transparent 70%);
}
#orb3 {
  left: 320px;
  top: 760px;
  width: 420px;
  height: 420px;
  background: radial-gradient(circle, #4f46e5 0%, transparent 70%);
  opacity: 0.25;
}

/* Subtle Geometric Grid Floor Accent */
.grid-floor {
  position: absolute;
  left: 0;
  top: 0;
  width: 1080px;
  height: 1080px;
  background-image:
    linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  opacity: 0.5;
  pointer-events: none;
}

/* 3D Scene Viewport */
#scene {
  position: absolute;
  left: 0;
  top: 0;
  width: 1080px;
  height: 1080px;
  perspective: 1600px;
  perspective-origin: 540px 540px;
}

/* 3D Gimbal Rig */
.rig {
  position: absolute;
  left: 0;
  top: 0;
  width: 1080px;
  height: 1080px;
  transform-style: preserve-3d;
  transform-origin: 540px 540px;
}
.layer {
  position: absolute;
  left: 0;
  top: 0;
  width: 1080px;
  height: 1080px;
}
.plane {
  position: absolute;
}

/* Main Spatial Player Chassis */
.chassis {
  position: absolute;
  left: 270px;
  top: 135px;
  width: 540px;
  height: 810px;
  border-radius: 40px;
  background: linear-gradient(165deg, #12162a 0%, #080a14 100%);
  border: 1px solid rgba(255, 255, 255, 0.14);
  box-shadow: 0 40px 100px rgba(0, 0, 0, 0.75);
  overflow: hidden;
}

/* Header Bar */
.header-bar {
  position: absolute;
  left: 36px;
  top: 34px;
  width: 468px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.pill-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
}
.pill-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #06b6d4;
  box-shadow: 0 0 10px #06b6d4;
}
.pill-text {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: #a5b4fc;
  text-transform: uppercase;
}
.header-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  color: #94a3b8;
  text-transform: uppercase;
}

/* Holographic Soundstage Deck */
.soundstage {
  position: absolute;
  left: 36px;
  top: 86px;
  width: 468px;
  height: 310px;
  border-radius: 26px;
  background: linear-gradient(145deg, #1b163d 0%, #0c0f24 100%);
  border: 1px solid rgba(139, 92, 246, 0.35);
  box-shadow: inset 0 0 40px rgba(124, 58, 237, 0.2);
  overflow: hidden;
}

/* Radar Rings */
.radar-ring {
  position: absolute;
  left: 50%;
  top: 48%;
  border-radius: 50%;
  border: 1px solid rgba(6, 182, 212, 0.18);
  transform: translate(-50%, -50%);
}
.ring-1 { width: 90px; height: 90px; }
.ring-2 { width: 170px; height: 170px; }
.ring-3 { width: 250px; height: 250px; border-style: dashed; opacity: 0.5; }

/* Rotating Binaural Beam */
.binaural-beam {
  position: absolute;
  left: 50%;
  top: 48%;
  width: 2px;
  height: 120px;
  background: linear-gradient(to top, rgba(6, 182, 212, 0.9), transparent);
  transform-origin: 50% 100%;
  margin-left: -1px;
  margin-top: -120px;
}

/* Soundstage Center Core */
.sound-core {
  position: absolute;
  left: 50%;
  top: 48%;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, #06b6d4 0%, #7c3aed 100%);
  transform: translate(-50%, -50%);
  box-shadow: 0 0 20px #06b6d4;
}

/* Harmonic Equalizer Waveform across Soundstage */
.wave-row {
  position: absolute;
  left: 24px;
  bottom: 20px;
  width: 420px;
  height: 90px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
}
.wave-col {
  width: 6px;
  border-radius: 3px;
  background: linear-gradient(to top, #7c3aed 0%, #06b6d4 100%);
}

/* Track Metadata Section */
.track-meta {
  position: absolute;
  left: 36px;
  top: 422px;
  width: 468px;
}
.track-headline {
  font-size: 30px;
  font-weight: 800;
  color: #ffffff;
  letter-spacing: -0.5px;
  line-height: 36px;
}
.artist-headline {
  font-size: 15px;
  font-weight: 600;
  color: #94a3b8;
  margin-top: 4px;
}
.tech-spec-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 10px;
  padding: 4px 10px;
  border-radius: 8px;
  background: rgba(6, 182, 212, 0.12);
  border: 1px solid rgba(6, 182, 212, 0.3);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  color: #38bdf8;
}

/* Scrubber Section */
.scrub-wrap {
  position: absolute;
  left: 36px;
  top: 526px;
  width: 468px;
}
.scrub-bar {
  position: relative;
  width: 100%;
  height: 6px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.1);
  overflow: visible;
}
.scrub-progress {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  border-radius: 3px;
  background: linear-gradient(90deg, #7c3aed 0%, #06b6d4 100%);
}
.scrub-pin {
  position: absolute;
  top: -5px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 0 14px #06b6d4;
  transform: translateX(-50%);
}
.scrub-times {
  display: flex;
  justify-content: space-between;
  margin-top: 10px;
  font-size: 12px;
  font-weight: 600;
  color: #64748b;
  font-variant-numeric: tabular-nums;
}

/* Playback Control Buttons */
.controls-wrap {
  position: absolute;
  left: 36px;
  top: 596px;
  width: 468px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.aux-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  align-items: center;
  justify-content: center;
}
.nav-step-btn {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.12);
  display: flex;
  align-items: center;
  justify-content: center;
}
.hero-play-btn {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: linear-gradient(135deg, #7c3aed 0%, #06b6d4 100%);
  box-shadow: 0 12px 32px rgba(124, 58, 237, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Bottom Spectrum Equalizer Visualizer */
.spectrum-row {
  position: absolute;
  left: 36px;
  top: 708px;
  width: 468px;
  height: 52px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding: 0 8px;
}
.spec-bar {
  width: 9px;
  border-radius: 4px;
  background: linear-gradient(to top, rgba(124, 58, 237, 0.3) 0%, #06b6d4 100%);
}

/* Satellite Floating Badges (Rigid Body Containers for Code Motion) */
.badge-satellite-lossless {
  left: 140px;
  top: 250px;
  width: 226px;
  height: 68px;
  border-radius: 20px;
  background: #0f1325;
  border: 1px solid rgba(245, 158, 11, 0.45);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 24px 50px rgba(0, 0, 0, 0.6);
}
.amber-circle-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4);
}

.badge-satellite-spatial {
  left: 690px;
  top: 470px;
  width: 236px;
  height: 68px;
  border-radius: 20px;
  background: #0a1426;
  border: 1px solid rgba(6, 182, 212, 0.45);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 24px 50px rgba(0, 0, 0, 0.6);
}
.cyan-circle-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: linear-gradient(135deg, #06b6d4 0%, #0284c7 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 14px rgba(6, 182, 212, 0.4);
}

.badge-satellite-telemetry {
  left: 710px;
  top: 140px;
  width: 196px;
  height: 56px;
  border-radius: 18px;
  background: #15102e;
  border: 1px solid rgba(139, 92, 246, 0.45);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.55);
}
.violet-circle-icon {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 12px rgba(139, 92, 246, 0.35);
}

.badge-title {
  color: #ffffff;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.5px;
  line-height: 16px;
}
.badge-subtitle {
  color: #94a3b8;
  font-size: 11px;
  font-weight: 500;
  line-height: 14px;
}

svg {
  display: block;
}
</style>
</head>

<script>
// ================= CODE MOTION ENGINE INTEGRATION =================
// Rule 2: Explicit 10.0 Second Duration Constant
const DURATION = 10.0;

// Rule 5: Native CSS 3D Scene Parallax Rig
const PERSPECTIVE = 1600;
const ORIGIN_X = 540;
const ORIGIN_Y = 540;

document.querySelectorAll('.plane').forEach(plane => {
  const z = +plane.dataset.z || 0;
  const scaleRatio = (PERSPECTIVE - z) / PERSPECTIVE;
  const layer = document.createElement('div');
  layer.className = 'layer';
  plane.parentNode.insertBefore(layer, plane);
  layer.appendChild(plane);
  layer.style.transformOrigin = ORIGIN_X + 'px ' + ORIGIN_Y + 'px';
  layer.style.transform = 'translateZ(' + z + 'px) scale(' + scaleRatio.toFixed(5) + ')';
});

// Cache DOM Elements for 60fps / virtual time performance
const stage = document.getElementById('stage');
const rig = document.getElementById('rig');
const orb1 = document.getElementById('orb1');
const orb2 = document.getElementById('orb2');
const orb3 = document.getElementById('orb3');
const radarBeam = document.getElementById('radarBeam');
const scrubProgress = document.getElementById('scrubProgress');
const scrubPin = document.getElementById('scrubPin');
const timeElapsed = document.getElementById('timeElapsed');

const pops = [...document.querySelectorAll('.pop')].map(el => ({
  el: el,
  at: +el.dataset.at || 0
}));

// Waveform Columns
const waveCols = [];
for (let i = 0; i < 12; i++) {
  waveCols.push(document.getElementById('wcol' + i));
}

// Spectrum Equalizer Bars
const specBars = [];
for (let i = 0; i < 16; i++) {
  specBars.push(document.getElementById('sp' + i));
}

// Math Utility Helpers
function clamp(val, min = 0, max = 1) {
  return Math.max(min, Math.min(max, val));
}

function outCubic(t) {
  return 1 - Math.pow(1 - t, 3);
}

function outBack(t) {
  const c1 = 1.70158;
  const c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}

// ================= TIME-DRIVEN RENDER FUNCTION =================
// Rule 3: Deterministic renderFrame(t)
function renderFrame(t) {
  // Safe modulo to guarantee t stays strictly within [0, DURATION)
  const tt = ((t % DURATION) + DURATION) % DURATION;
  const normTime = tt / DURATION; // 0.0 to 1.0 (exact cycle)
  const twoPi = Math.PI * 2;

  // 1. Cinematic 3D Gimbal Sweeps
  // Exactly periodic harmonic frequencies ensure a 100% seamless 10-second loop
  const rotY = Math.sin(normTime * twoPi) * 16.0;   // -16deg to +16deg
  const rotX = Math.cos(normTime * twoPi) * 9.0;    // -9deg to +9deg
  const rotZ = Math.sin(normTime * twoPi) * 2.2;    // -2.2deg to +2.2deg
  rig.style.transform = 'rotateX(' + rotX.toFixed(3) + 'deg) rotateY(' + rotY.toFixed(3) + 'deg) rotateZ(' + rotZ.toFixed(3) + 'deg)';

  // 2. Ambient Atmosphere Drift (Harmonic loops)
  const orbX1 = 140 + Math.sin(normTime * twoPi) * 55;
  const orbY1 = 160 + Math.cos(normTime * twoPi) * 40;
  orb1.style.left = orbX1.toFixed(1) + 'px';
  orb1.style.top = orbY1.toFixed(1) + 'px';

  const orbX2 = 540 - Math.sin(normTime * twoPi) * 60;
  const orbY2 = 500 - Math.cos(normTime * twoPi) * 45;
  orb2.style.left = orbX2.toFixed(1) + 'px';
  orb2.style.top = orbY2.toFixed(1) + 'px';

  // 3. Rotating Binaural Radar Beam
  // Rotates 2 full 360-degree cycles over 10 seconds
  const beamAngle = (normTime * 2 * 360) % 360;
  radarBeam.style.transform = 'rotate(' + beamAngle.toFixed(2) + 'deg)';

  // 4. Scrubber Timeline Progression (Loops smoothly from 25% to 75% then continuous)
  const scrubPct = 25.0 + ((normTime * 50.0) % 50.0);
  scrubProgress.style.width = scrubPct.toFixed(2) + '%';
  scrubPin.style.left = scrubPct.toFixed(2) + '%';

  const elapsedSecs = Math.floor(65 + (normTime * 48));
  const mins = Math.floor(elapsedSecs / 60);
  const secs = elapsedSecs % 60;
  timeElapsed.textContent = (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;

  // 5. Rigid-Body Satellite Badges Spring Pop
  pops.forEach(p => {
    // When tt is before p.at, it remains scaled to 0 and transparent
    if (tt < p.at) {
      p.el.style.transform = 'scale(0)';
      p.el.style.opacity = '0';
    } else {
      const popProgress = clamp((tt - p.at) / 0.55);
      const popScale = outBack(popProgress);
      const popOpacity = clamp((tt - p.at) / 0.18);
      p.el.style.transform = 'scale(' + popScale.toFixed(4) + ')';
      p.el.style.opacity = popOpacity.toFixed(3);
    }
  });

  // 6. Soundstage Internal Waveform Columns
  waveCols.forEach((col, idx) => {
    if (!col) return;
    // Harmonic oscillation tied to loop integer multiples
    const freq = normTime * twoPi * 4 + idx * 0.75;
    const wave = 0.5 + 0.5 * Math.sin(freq);
    const height = 24 + wave * 66; // 24px to 90px
    col.style.height = height.toFixed(1) + 'px';
  });

  // 7. Bottom Spectrum Equalizer Bars
  specBars.forEach((bar, idx) => {
    if (!bar) return;
    const wave1 = Math.sin(normTime * twoPi * 5 + idx * 0.6);
    const wave2 = Math.cos(normTime * twoPi * 3 + idx * 1.1);
    const combined = Math.abs(wave1 * 0.65 + wave2 * 0.35);
    const height = 12 + combined * 38; // 12px to 50px
    bar.style.height = height.toFixed(1) + 'px';
  });
}

// Deterministic Seek Hook for Code Motion / Puppeteer Tracer
let isSeeking = false;
window.seek = function(timeSeconds) {
  isSeeking = true;
  renderFrame(timeSeconds);
};

// Live 60fps Playback Engine
const startTime = performance.now();
function animate() {
  if (isSeeking) return;
  const elapsed = (performance.now() - startTime) / 1000;
  renderFrame(elapsed % DURATION);
  requestAnimationFrame(animate);
}

// Initial zero frame render
renderFrame(0);
requestAnimationFrame(animate);

// Rule 1: Responsive Auto-Fit to Window
function fitToWindow() {
  const scale = Math.min(window.innerWidth / 1080, window.innerHeight / 1080);
  stage.style.transform = 'scale(' + scale + ')';
}
window.addEventListener('resize', fitToWindow);
fitToWindow();
</script>
