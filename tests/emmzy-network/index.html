  <!-- Live Editable Typography: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #eef2f7;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Fixed-Size 1920x1080 Viewport for Native After Effects Comp */
    #stage {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1920px;
      height: 1080px;
      margin: -540px 0 0 -960px;
      background: #f8fafd;
      overflow: hidden;
      transform-origin: center center;
    }

    /* Faint Network Connections (Native Bezier Shape Paths) */
    .connections-canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      pointer-events: none;
      z-index: 1;
    }

    /* Center Identity Card */
    .center-card {
      position: absolute;
      left: 710px;
      top: 420px;
      width: 500px;
      height: 270px;
      border-radius: 44px;
      background: linear-gradient(135deg, #ff9f2c 0%, #ee2537 100%);
      box-shadow: 0 32px 70px rgba(238, 37, 55, 0.32);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      z-index: 10;
    }

    .card-avatar-box {
      width: 86px;
      height: 86px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .card-title {
      color: #ffffff;
      font-size: 50px;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1;
    }

    /* Satellite Pills */
    .satellite-pill {
      position: absolute;
      height: 64px;
      padding: 0 28px 0 12px;
      background: #ffffff;
      border-radius: 9999px;
      box-shadow: 0 18px 36px rgba(100, 116, 139, 0.14), 0 4px 10px rgba(100, 116, 139, 0.05);
      border: 1px solid #f1f5f9;
      display: inline-flex;
      align-items: center;
      gap: 14px;
      z-index: 20;
      white-space: nowrap;
    }

    .pill-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .pill-text {
      color: #334155;
      font-size: 21px;
      font-weight: 600;
      letter-spacing: -0.2px;
      line-height: 1;
    }

    .pill-mono {
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      font-weight: 500;
      letter-spacing: -0.3px;
      color: #475569;
    }

    .icon-dark          { background-color: #23272e; }

  <script>
    // Rule 2: Timeline Duration Constant (10 seconds composition)
    const DURATION = 10;

    // Rule 1: Lightweight Browser Preview Scaler
    function fitToWindow() {
      const stage = document.getElementById('stage');
      if (!stage) return;
      const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      stage.style.transform = 'scale(' + s + ')';
    }
    window.addEventListener('resize', fitToWindow);
    window.addEventListener('DOMContentLoaded', fitToWindow);
    fitToWindow();
  </script>
